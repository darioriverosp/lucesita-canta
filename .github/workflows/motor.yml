# Publica el motor de IA en Modal cada vez que cambia la carpeta motor/ (o a mano desde la pestaña Actions).
name: Publicar motor en Modal

on:
  push:
    branches: [main]
    paths: ["motor/**", ".github/workflows/motor.yml"]
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install modal
      - name: Guardar cookies de YouTube en Modal (opcional)
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: modal secret create luza-youtube YT_COOKIES="${YT_COOKIES:-ninguna}" --force
      - name: Publicar
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MOTOR_GPU: ${{ vars.MOTOR_GPU }}
        run: modal deploy motor/modal_app.py
